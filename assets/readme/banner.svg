<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Tech Challenge Fase 4 — Model monitoring and security</title>
  <desc id="desc">Capa em azul escuro e rosa, com um desenho de dados passando por validação, modelo e simulação.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#0b1424"/>
      <stop offset="1" stop-color="#152338"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#a4b5cd" opacity=".1"/>
    </pattern>
  </defs>
  <rect width="1200" height="360" rx="20" fill="url(#bg)"/>
  <rect width="1200" height="360" rx="20" fill="url(#grid)"/>
  <rect x="48" y="45" width="4" height="22" rx="2" fill="#ed3b7d"/>
  <g font-family="Segoe UI,Arial,sans-serif">
    <text x="66" y="62" fill="#ef8fb2" font-size="13" font-weight="700" letter-spacing="3">TECH CHALLENGE / FASE 04</text>
    <text x="48" y="133" fill="#f3f7fd" font-size="48" font-weight="700" letter-spacing="-1.5">Model monitoring</text>
    <text x="48" y="189" fill="#f3f7fd" font-size="48" font-weight="700" letter-spacing="-1.5">and security</text>
    <text x="50" y="234" fill="#b8c7db" font-size="18">Qualidade de dados e sustentação de um modelo de crédito.</text>
    <path d="M50 277H665" stroke="#334157"/>
    <text x="50" y="310" fill="#93a8c2" font-size="12" letter-spacing="2">VALIDAÇÃO</text>
    <circle cx="167" cy="306" r="2" fill="#ed3b7d"/>
    <text x="185" y="310" fill="#93a8c2" font-size="12" letter-spacing="2">MODELO BASE</text>
    <circle cx="326" cy="306" r="2" fill="#ed3b7d"/>
    <text x="344" y="310" fill="#93a8c2" font-size="12" letter-spacing="2">SIMULAÇÃO DE DRIFT</text>
    <rect x="785" y="46" width="366" height="266" rx="18" fill="#0b1424" stroke="#30425c"/>
    <text x="810" y="77" fill="#93a8c2" font-size="11" letter-spacing="2">DO DADO À PREDIÇÃO</text>
    <path d="M968 119V249" stroke="#405671" stroke-width="2" stroke-dasharray="4 5"/>
    <rect x="815" y="96" width="305" height="48" rx="9" fill="#17273c" stroke="#344c66"/>
    <path d="M834 113H847M834 121H847M834 129H847" stroke="#9fbedc" stroke-width="2" stroke-linecap="round"/>
    <text x="864" y="125" fill="#e6edf6" font-size="15">Dados validados</text>
    <circle cx="1097" cy="120" r="5" fill="#65d5b3"/>
    <rect x="815" y="164" width="305" height="48" rx="9" fill="#17273c" stroke="#344c66"/>
    <path d="M835 188L841 182L847 188L841 194Z" fill="none" stroke="#9fbedc" stroke-width="2"/>
    <text x="864" y="193" fill="#e6edf6" font-size="15">Modelo congelado</text>
    <circle cx="1097" cy="188" r="5" fill="#65d5b3"/>
    <rect x="815" y="232" width="305" height="48" rx="9" fill="#302039" stroke="#a64872"/>
    <path d="M832 258H837L841 247L845 265L849 254H854" fill="none" stroke="#f08db4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="864" y="261" fill="#f8d9e8" font-size="15">Controle × cenário alterado</text>
  </g>
</svg>
